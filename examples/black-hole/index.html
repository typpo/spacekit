<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Black Hole | Spacekit</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #030407; color: #eef2fa; font: 14px/1.5 system-ui, sans-serif; }
    #main-container { position: fixed; inset: 0; }
    header { position: absolute; top: 20px; left: 24px; max-width: 360px; text-shadow: 0 1px 8px #000; }
    h1 { font-size: 24px; font-weight: 500; margin: 0 0 10px; }
    nav { display: flex; gap: 4px; margin-bottom: 10px; }
    nav a { color: #aab4c5; text-decoration: none; padding: 6px 12px; border: 1px solid #354052; border-radius: 6px; background: #101722cc; }
    nav a:hover { border-color: #9daec5; }
    nav a[aria-current="page"] { color: #eef2fa; border-color: #d9ad73; }
    header p { color: #aab4c5; margin: 6px 0; pointer-events: none; }
    header p:empty { display: none; }
    #facts, #date { font-variant-numeric: tabular-nums; font-size: 13px; }
    #error { color: #ffb0a0; }
    #controls { position: absolute; bottom: 20px; left: 24px; right: 24px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 14px; background: #0b111be8; border: 1px solid #ffffff20; border-radius: 10px; }
    #controls label { display: flex; gap: 7px; align-items: center; white-space: nowrap; }
    button, select { color: #eef2fa; background: #151e2b; border: 1px solid #3b485b; border-radius: 6px; padding: 7px 11px; font: inherit; cursor: pointer; }
    button:hover, select:hover { border-color: #9daec5; }
    input { accent-color: #d9ad73; }
    .note { flex-basis: 100%; color: #8797ac; font-size: 12px; margin: 0; }
    #main-container .spacekit__object-label { pointer-events: none; background: transparent !important; outline: none !important; text-shadow: 0 1px 4px #000; }
    @media (max-width: 650px) {
      header { left: 12px; top: 10px; max-width: 300px; }
      h1 { font-size: 20px; }
      #controls { left: 10px; right: 10px; bottom: 10px; gap: 8px; padding: 10px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div id="main-container" aria-label="Black hole scene; drag to orbit and scroll to zoom"></div>
  <header>
    <h1>Black hole</h1>
    <nav aria-label="Scenes">
      <a href="?scene=galaxy" data-scene="galaxy">Black hole</a>
      <a href="?scene=meteors" data-scene="meteors">Meteor shower</a>
      <a href="?scene=saturn" data-scene="saturn">Saturn</a>
    </nav>
    <p id="date"></p>
    <p id="facts"></p>
    <p id="disk-facts"></p>
    <p id="error" role="alert"></p>
  </header>
  <div id="controls" aria-label="Scene controls"></div>

  <template id="controls-galaxy">
    <button id="pause" type="button">Pause disk</button>
    <button id="disk" type="button">Hide disk</button>
    <label>View <select id="view"><option value="inclined">Inclined</option><option value="overhead">Overhead</option><option value="edge">Edge-on</option></select></label>
    <label>Disk thickness <select id="thickness"><option value="0.025" selected>Thin</option><option value="0.06">Moderate</option><option value="0.12">Thick</option></select></label>
    <label>Rotation <select id="rotation"><option value="1">1× real time</option><option value="20">20×</option><option value="200" selected>200×</option><option value="1000">1000×</option></select></label>
    <label>Outer radius <select id="extent"><option value="12">12× horizon</option><option value="30" selected>30× horizon</option><option value="100">100× horizon</option></select></label>
    <button id="fit" type="button">Fit full disk</button>
    <p class="note">Drag to orbit · Scroll to zoom · Sky: ESO/S. Brunier, CC BY 4.0</p>
  </template>

  <template id="controls-meteors">
    <button id="pause" type="button">Pause</button>
    <label>View <select id="view"><option value="stream">Through the stream</option><option value="overview">Solar system</option></select></label>
    <label><input id="disk" type="checkbox" checked>Disk</label>
    <label><input id="lensing" type="checkbox" checked>Lens scene</label>
    <p class="note">Drag to orbit · Scroll to zoom · Each catalogued Perseid orbit is cloned with small perturbations to fill out the stream. The hole bends light but does not pull on the meteoroids.</p>
  </template>

  <template id="controls-saturn">
    <button id="pause" type="button">Pause</button>
    <label>View <select id="view"><option value="lensed">Saturn behind the hole</option><option value="system">Saturn system</option><option value="saturn">Saturn close-up</option></select></label>
    <label><input id="orbits" type="checkbox" checked>Moon orbits</label>
    <label><input id="disk" type="checkbox" checked>Disk</label>
    <label><input id="lensing" type="checkbox" checked>Lens scene</label>
    <p class="note">Drag to orbit · Scroll to zoom · Saturn and its moons are to scale. The hole bends light but does not pull on them.</p>
  </template>

  <script src="../../build/spacekit.js"></script>
  <script>
    // Each scene is a separate simulation, so switching tabs reloads the page.
    const SCENES = {
      galaxy: ['galaxy.js'],
      meteors: ['perseids.js', 'meteor-shower.js'],
      saturn: ['saturn.js'],
    };
    const requested = new URLSearchParams(location.search).get('scene');
    const scene = SCENES[requested] ? requested : 'galaxy';
    document
      .querySelector(`nav a[data-scene="${scene}"]`)
      .setAttribute('aria-current', 'page');
    document
      .getElementById('controls')
      .append(document.getElementById(`controls-${scene}`).content);
    SCENES[scene].forEach((src) => {
      const script = document.createElement('script');
      script.src = src;
      script.async = false;
      document.body.append(script);
    });
  </script>
</body>
</html>
