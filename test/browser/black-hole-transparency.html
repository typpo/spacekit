<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>Black hole transparent-layer validation</title>
<link rel="icon" href="data:,">
<pre id="results">Running transparent-layer GPU checks...</pre>
<script src="../../build/spacekit.js"></script>
<script>
(async () => {
  const T = Spacekit.THREE;
  const renderer = new T.WebGL1Renderer();
  const size = 256;
  renderer.setSize(size, size);
  renderer.setClearColor(0, 0);
  const target = new T.WebGLRenderTarget(size, size);
  const scene = new T.Scene();
  const camera = new T.PerspectiveCamera(50, 1, 0.01, 100);
  camera.position.z = 8;
  camera.lookAt(0, 0, 0);
  const initialView = camera.quaternion.clone();
  const simulation = {
    getContext: () => ({ options: {}, objects: { renderer } }),
    getJd: () => 2451545,
    addObject: object => scene.add(...object.get3jsObjects()),
    removeObject: object => { scene.remove(...object.get3jsObjects()); object.removalCleanup(); },
  };
  const results = [];
  const assert = (condition, message) => {
    if (!condition) throw new Error(message);
    results.push('PASS: ' + message);
  };
  const read = output => {
    const pixels = new Uint8Array(size * size * 4);
    renderer.readRenderTargetPixels(output, 0, 0, size, size, pixels);
    return pixels;
  };
  const render = () => {
    renderer.setRenderTarget(target);
    renderer.render(scene, camera);
    return read(target);
  };
  let texture, cloud, ring, underlay, sheet, pair, hole;
  try {
    texture = await new Promise((resolve, reject) => new T.TextureLoader().load(
      '../../src/assets/sprites/fuzzyparticle.png', resolve, undefined, reject));
    // Like GPU moons and Saturn's rings, the objects have the same origin.
    // One batch contains particles both in front of and behind the surface.
    const positions = [-2, 0, -5, 3.5, 0, -15];
    cloud = new T.Points(
      new T.BufferGeometry().setAttribute('position', new T.Float32BufferAttribute(positions, 3)),
      new T.PointsMaterial({ size: 60, sizeAttenuation: false, map: texture, transparent: true, depthWrite: false }),
    );
    ring = new T.Mesh(new T.PlaneGeometry(30, 30).translate(0, 0, -10),
      new T.MeshBasicMaterial({ color: 0x808080, transparent: true }));
    scene.add(cloud, ring);
    for (const quality of ['low', 'high']) {
      hole = new Spacekit.BlackHole('transparency', {
        massSolar: 4e6, lensScene: true, accretionDisk: false, quality,
      }, simulation);
      for (const blending of [T.NormalBlending, T.AdditiveBlending]) {
        cloud.material.blending = blending;
        for (const opacity of [0.65, 1]) for (const angle of [0, 0.04]) {
          ring.material.opacity = opacity;
          camera.quaternion.copy(initialView);
          camera.rotateY(angle);
          ring.visible = false; cloud.visible = true;
          cloud.geometry.setDrawRange(0, 1);
          const frontImage = render();
          cloud.geometry.setDrawRange(1, 1);
          const behindImage = render();
          cloud.geometry.setDrawRange(0, 2);
          ring.visible = true; cloud.visible = false;
          ring.material.color.set(0xffffff);
          const ringCoverage = render();
          ring.material.color.set(0x808080);
          const ringImage = render();
          cloud.visible = true;
          let firstImage;
          for (const order of [-1, 1]) {
            ring.renderOrder = order;
            const image = render();
            let maxError = 0, sampled = 0;
            for (let i = 0; i < image.length; i += 4) {
              if (frontImage[i] > 2 || behindImage[i] > 2) sampled++;
              // Independent reference: render each object alone, then compose
              // the images in their known physical order (far, ring, near).
              const frontAlpha = blending === T.AdditiveBlending ? 0 : frontImage[i] / 255;
              const behindRing = ringImage[i] + (1 - ringCoverage[i] / 255) * behindImage[i];
              const expected = Math.min(255, frontImage[i] + (1 - frontAlpha) * behindRing);
              maxError = Math.max(maxError, Math.abs(image[i] - expected));
            }
            const label = quality + ', blend=' + blending + ', opacity=' + opacity + ', yaw=' + angle;
            assert(sampled > 100 && maxError <= 3,
              label + ': final image matches separately lensed objects with ring order ' + order + ' (error ' + maxError.toFixed(2) + ')');
            let darkening = 0;
            for (let i = 0; i < image.length; i += 4) darkening = Math.max(darkening, ringImage[i] - image[i]);
            assert(darkening <= 2, label + ': white particles do not darken the lensed ring (drop ' + darkening + ')');
            if (firstImage) {
              const difference = image.reduce((max, value, i) => Math.max(max, Math.abs(value - firstImage[i])), 0);
              assert(difference <= 2, label + ': changing draw order preserves the lensed image');
            }
            firstImage = image;
          }
        }
      }
      // Both surfaces share a capture layer. A nearer translucent object must
      // allow a farther one to blend underneath even if it is drawn first.
      cloud.visible = false;
      ring.material.opacity = 0.5;
      ring.material.color.set(0x00ff00);
      underlay = new T.Mesh(new T.PlaneGeometry(30, 30).translate(0, 0, -15),
        new T.MeshBasicMaterial({ color: 0x0000ff, opacity: 0.5, transparent: true }));
      scene.add(underlay);
      ring.renderOrder = -1;
      const nearFirst = render();
      ring.renderOrder = 1;
      const farFirst = render();
      assert(nearFirst.some((value, i) => i % 4 === 2 && value > 20 && nearFirst[i - 1] > 20),
        quality + ': both overlapping translucent surfaces contribute light');
      assert(nearFirst.reduce((max, value, i) => Math.max(max, Math.abs(value - farFirst[i])), 0) <= 1,
        quality + ': a farther surface blends underneath one drawn earlier');
      scene.remove(underlay);
      underlay.geometry.dispose(); underlay.material.dispose(); underlay = null;
      hole.dispose(); hole = null;
    }
    // Nearby, non-overlapping sprites must not borrow each other's depth.
    // Their square footprints have a four-pixel gap in the capture, and the
    // farther green sprite cannot physically change the nearer red image.
    // Sprites larger than the smoothing radius, or red neighbors overlapping
    // the near sprite at its own depth, must not let depth across the gap.
    cloud.visible = false; ring.visible = false;
    camera.quaternion.copy(initialView);
    pair = new T.Points(new T.BufferGeometry(),
      new T.PointsMaterial({ sizeAttenuation: false, map: texture, vertexColors: true, transparent: true, depthWrite: false }));
    scene.add(pair);
    const focal = size / 2 / Math.tan(camera.fov * Math.PI / 360);
    for (const quality of ['low', 'high']) {
      hole = new Spacekit.BlackHole('sparse', { massSolar: 4e6, lensScene: true, accretionDisk: false, quality }, simulation);
      for (const spriteSize of [8, 16, 24, 32]) for (const offset of [0, 0.5]) for (const crowded of [false, true]) {
        const halfSpacing = (spriteSize + 4) / 2;
        const near = [[-halfSpacing + offset, 0]];
        if (crowded) {
          const step = 0.75 * spriteSize;
          near.push([-halfSpacing + offset - step, 0], [-halfSpacing + offset, step], [-halfSpacing + offset, -step]);
        }
        const positions = [], colors = [];
        for (const [x, y] of near) positions.push(x * 10 / focal, y * 10 / focal, -2), colors.push(1, 0, 0);
        positions.push((halfSpacing + offset) * 28 / focal, 0, -20); colors.push(0, 1, 0);
        pair.geometry.setAttribute('position', new T.Float32BufferAttribute(positions, 3));
        pair.geometry.setAttribute('color', new T.Float32BufferAttribute(colors, 3));
        pair.material.size = spriteSize;
        pair.geometry.setDrawRange(0, near.length);
        const alone = render();
        pair.geometry.setDrawRange(0, near.length + 1);
        const together = render();
        let difference = 0, light = 0;
        for (let i = 0; i < alone.length; i += 4) {
          difference += Math.abs(alone[i] - together[i]);
          light += alone[i];
        }
        assert(light > 1000 && difference === 0,
          quality + ': disjoint ' + spriteSize + 'px sprites' + (crowded ? ' beside a cluster' : '') +
          ' preserve depth at offset ' + offset + ' (' + difference + ' difference)');
      }
      hole.dispose(); hole = null;
    }
    scene.remove(pair); pair.geometry.dispose(); pair.material.dispose(); pair = null;

    // Overlapping sprites at different distances share one captured depth per
    // pixel. Spread a dense cloud in depth behind the hole, scaled so its
    // unlensed image is unchanged. The nearest square quad at each pixel must
    // not cut the lensed light into tiles.
    cloud.visible = false; ring.visible = false;
    camera.quaternion.copy(initialView);
    let seed = 7;
    const random = () => (seed = (1664525 * seed + 1013904223) >>> 0) / 4294967296;
    const planar = [], spread = [];
    for (let i = 0; i < 8192; i++) {
      const x = (random() - 0.5) * 12, y = (random() - 0.5) * 12, z = -2 + (random() - 0.5) * 3;
      const scale = (camera.position.z - z) / (camera.position.z + 2);
      planar.push(x, y, -2);
      spread.push(x * scale, y * scale, z);
    }
    sheet = new T.Points(
      new T.BufferGeometry().setAttribute('position', new T.Float32BufferAttribute(planar, 3)),
      new T.PointsMaterial({ size: 16, sizeAttenuation: false, map: texture, transparent: true, depthWrite: false }),
    );
    scene.add(sheet);
    hole = new Spacekit.BlackHole('sheet', { massSolar: 2e7, lensScene: true, accretionDisk: false }, simulation);
    const planarImage = render();
    sheet.geometry.setAttribute('position', new T.Float32BufferAttribute(spread, 3));
    const spreadImage = render();
    // Soft sprites have no hard edges, but the tiles do. Count large steps
    // between neighboring pixels outside the shadow and the brightest images.
    const measure = image => {
      let edges = 0, light = 0;
      for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) {
        if (Math.hypot(x - size / 2, y - size / 2) < 80) continue;
        const i = (y * size + x) * 4;
        light += image[i];
        if (Math.abs(image[i] - image[i + 4]) > 64) edges++;
        if (Math.abs(image[i] - image[i + size * 4]) > 64) edges++;
      }
      return { edges, light };
    };
    const planarSheet = measure(planarImage), spreadSheet = measure(spreadImage);
    assert(spreadSheet.light > 0.9 * planarSheet.light && spreadSheet.edges <= 2 * planarSheet.edges + 50,
      'overlapping sprites at different depths lens without tiles (' + spreadSheet.edges + ' hard edges, ' +
      planarSheet.edges + ' on one plane)');
    hole.dispose(); hole = null;
    assert(cloud.material.depthWrite === false && cloud.material.depthTest && cloud.material.colorWrite,
      'particle depth/color settings survive captures');
    assert(renderer.info.programs.every(program => !program.diagnostics || program.diagnostics.runnable), 'all shaders compile');
    results.push('ALL CHECKS PASSED');
  } catch (error) {
    results.push('FAIL: ' + error.message);
    console.error(error);
  } finally {
    if (hole) hole.dispose();
    for (const object of [cloud, ring, underlay, sheet, pair]) if (object) { object.geometry.dispose(); object.material.dispose(); }
    if (texture) texture.dispose();
    target.dispose(); renderer.dispose();
    document.getElementById('results').textContent = results.join('\n');
  }
})();
</script>
