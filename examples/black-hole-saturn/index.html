<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Black Hole near Saturn | Spacekit</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #030508; color: #edf3fa; font: 14px/1.5 system-ui, sans-serif; }
    #main-container { position: fixed; inset: 0; }
    header { position: absolute; top: 24px; left: 28px; max-width: 330px; pointer-events: none; text-shadow: 0 2px 12px #000; }
    h1 { font-size: 28px; line-height: 1.15; font-weight: 450; letter-spacing: -.04em; margin: 10px 0; }
    header p { color: #afbdcd; margin: 10px 0; }
    #date { color: #e7bc81; font-variant-numeric: tabular-nums; }
    #controls { position: absolute; bottom: 20px; left: 28px; right: 28px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 16px; background: #0b111be8; border: 1px solid #ffffff20; border-radius: 12px; }
    button, select { background: #151e2b; color: #edf3fa; border: 1px solid #3b485b; border-radius: 6px; padding: 8px 11px; font: inherit; cursor: pointer; }
    button:hover, select:hover { border-color: #9daec5; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #e7bc81; outline-offset: 3px; }
    label { display: flex; gap: 7px; align-items: center; white-space: nowrap; }
    input { accent-color: #e7bc81; }
    .note { flex-basis: 100%; color: #8797ac; font-size: 11px; }
    .note a { color: #b8c6d7; }
    #error { color: #ffae9f; }
    #main-container .spacekit__object-label { pointer-events: none; background: transparent !important; outline: none !important; text-shadow: 0 1px 4px #000, 0 0 8px #000; padding: 2px 4px; }
    @media (max-width: 650px) {
      header { left: 16px; top: 14px; max-width: 290px; }
      h1 { font-size: 23px; }
      header p { font-size: 12px; margin: 6px 0; }
      #controls { left: 12px; right: 12px; bottom: 12px; gap: 8px; padding: 10px; font-size: 12px; }
      button, select { padding: 7px 8px; }
      .note { font-size: 10px; }
    }
  </style>
</head>
<body>
  <div id="main-container" aria-label="Saturn and its moons seen through a black hole; drag to orbit, scroll to zoom"></div>
  <header>
    <h1>Black hole near Saturn</h1>
    <time id="date"></time>
    <p id="facts"></p>
    <p>Drag to orbit · Scroll to zoom · Right-drag to pan</p>
    <p id="error" role="alert"></p>
  </header>
  <div id="controls" aria-label="Scene controls">
    <button id="pause" type="button">Pause</button>
    <label>View <select id="view">
      <option value="lensed">Saturn behind the hole</option>
      <option value="system">Saturn system</option>
      <option value="saturn">Saturn close-up</option>
    </select></label>
    <label><input id="orbits" type="checkbox" checked>Moon orbits</label>
    <label><input id="disk" type="checkbox" checked>Disk</label>
    <label><input id="lensing" type="checkbox" checked>Lens scene</label>
    <div class="note">Toggle Lens scene to compare. Saturn and its moons are to scale; the hole bends light but does not pull on them.</div>
  </div>
  <script src="../../build/spacekit.js"></script>
  <script src="main.js"></script>
</body>
</html>
